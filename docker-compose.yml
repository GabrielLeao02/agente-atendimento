services:
  # API em modo produção: docker compose up --build
  api:
    build:
      context: .
      target: producao
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Testes com o código atual, sem precisar de Node na máquina: docker compose run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
    command: ["npm", "test"]
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
